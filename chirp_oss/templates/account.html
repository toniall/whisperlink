{% extends "base.html" %}
{% block title %}Account · {{ APP_NAME }}{% endblock %}
{% block content %}
<section class="narrow card">
  <h2>Account · {{ user.username }}</h2>
  {% if user.must_change %}<p class="flash warn">This account still uses a seeded password. Set your own to continue.</p>{% endif %}
  <form method="post" class="form">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>Current password<input name="current" type="password" autocomplete="current-password" required></label>
    <label>New password <small>(10+ characters)</small><input name="new" type="password" minlength="10" autocomplete="new-password" required></label>
    <label>Repeat new password<input name="new2" type="password" minlength="10" autocomplete="new-password" required></label>
    <button class="btn primary">Update password</button>
  </form>
</section>
{% endblock %}
